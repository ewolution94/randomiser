name: CI

# Runs on pull requests, and is the gate docker-publish.yml calls before it publishes
# anything, so the checks guarding a PR and the checks guarding a deploy can't drift apart.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The built page served by the real production server.
      - name: Smoke test the production server
        run: |
          PORT=6999 node server/server.mjs &
          server=$!
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:6999/healthz && break; sleep 0.5; done
          curl -sf http://127.0.0.1:6999/ | grep -q '<title>Randomiser</title>'
          curl -sf http://127.0.0.1:6999/anything | grep -q '<title>Randomiser</title>'
          curl -sI http://127.0.0.1:6999/ | grep -qi "content-security-policy: default-src 'self'"
          curl -sI http://127.0.0.1:6999/ | grep -qi "cache-control: no-cache"
          curl -sf http://127.0.0.1:6999/manifest.webmanifest | grep -q '"name": "Randomiser"'
          curl -sf -o /dev/null http://127.0.0.1:6999/sw.js
          curl -sf -o /dev/null http://127.0.0.1:6999/og.png
          asset=$(curl -s http://127.0.0.1:6999/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -sI "http://127.0.0.1:6999$asset" | grep -qi 'cache-control: public, max-age=31536000, immutable'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:6999/assets/missing.js)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:6999/)" = 405
          # The Census forwarder is wired in; without RANDOMISER_CENSUS it answers locally.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:6999/_e.js)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST --data '{}' http://127.0.0.1:6999/_e)" = 204
          # Without Dashboard: its values block in the page with the built-in ones, and the manifest.
          curl -sf http://127.0.0.1:6999/ | grep -q '<script type="application/json" id="ewo-config">{"lang":"system","sounds":false}</script>'
          curl -sf http://127.0.0.1:6999/anything | grep -q 'id="ewo-config"'
          curl -sf http://127.0.0.1:6999/ewo.config.json | grep -q '"app": "randomiser"'
          kill $server
          wait $server || true

      # The server against a stand-in for Dashboard's apps' port: it takes the manifest, and the
      # family's German and sounds reach the page.
      - name: Smoke test Dashboard's values
        run: |
          node --input-type=module -e "
            import http from 'node:http';
            http.createServer((req, res) => {
              if (req.method === 'PUT' && req.url === '/v1/manifest/randomiser') { req.resume(); return res.writeHead(204).end(); }
              if (req.url === '/v1/config/randomiser') return res.writeHead(200, { 'content-type': 'application/json', etag: '\"1\"' }).end(JSON.stringify({ family: { lang: 'de', sounds: true, theme: 'dark' }, app: {} }));
              res.writeHead(404).end();
            }).listen(6998);
          " &
          DASHBOARD_URL=http://127.0.0.1:6998 PORT=6997 node server/server.mjs &
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:6997/healthz && break; sleep 0.5; done
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:6997/ | grep -q '"sounds":true' && break; sleep 0.5; done
          curl -sf http://127.0.0.1:6997/ | grep -q '{"lang":"de","sounds":true}'
